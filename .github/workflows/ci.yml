# .github/workflows/ci.yml — HustleHub+ CI/CD Pipeline
# Runs on every push and pull request to main.
# Installs dependencies, runs backend tests (Newman), frontend tests (Vitest),
# builds both applications, and performs static code analysis.
#
# GitHub Actions docs: https://docs.github.com/en/actions
# Node.js CI workflow: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-nodejs
# MongoDB service container: https://docs.github.com/en/actions/use-cases-and-examples/using-containerized-services/creating-service-containers
# GitHub Actions caching: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows

name: HustleHub+ CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Start backend server
        run: |
          node server.js &
          sleep 5
        env:
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/hustlehub-test
          JWT_SECRET: ci-test-secret-key-not-for-production
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test

      - name: Run Newman API tests
        run: npx newman run HustleHub+.postman_collection.json -e HustleHub+_Environment.postman_environment.json --reporters cli,json --reporter-json-export newman-results.json

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.json

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run frontend tests
        working-directory: ./client
        run: npm test

      - name: Build frontend
        working-directory: ./client
        run: npm run build

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Run ESLint on backend
        run: npx eslint src/ --ext .js --format json --output-file eslint-backend-results.json || true

      - name: Run ESLint on frontend
        working-directory: ./client
        run: npx eslint src/ --ext .js,.jsx --format json --output-file ../eslint-frontend-results.json || true

      - name: Run npm audit
        run: npm audit --json > npm-audit-results.json || true

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: |
            eslint-backend-results.json
            eslint-frontend-results.json
            npm-audit-results.json

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t hustlehub-backend .

      - name: Build frontend image
        run: docker build -t hustlehub-frontend ./client

      - name: Verify images
        run: |
          docker images | grep hustlehub
